server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash de Vite: cacheables indefinidamente.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El índice no se cachea: así un despliegue se ve al instante.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA (react-router): cualquier ruta desconocida vuelve al índice.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
